<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wifi del salón</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="estilo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  main{max-width:1700px;min-height:100svh;margin:0 auto;padding:clamp(16px,3vh,36px) 18px;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .corner{position:fixed;width:min(40vw,260px);top:-8px;z-index:-1}
  .corner.l{left:-18px}
  .corner.r{right:-18px;transform:scaleX(-1)}
  /* Televisor: QR a la izquierda a todo lo alto; a la derecha el título grande, el mensaje y los datos */
  .wifi{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"qr cab" "qr datos";column-gap:clamp(28px,4vw,72px);row-gap:clamp(10px,2vh,24px);align-items:center;width:100%;text-align:center}
  .cab{grid-area:cab;align-self:end}
  .cab .kicker{font-size:clamp(.9rem,1.9vh,1.3rem)}
  h1.script{font-size:clamp(4rem,min(16vh,7.4vw),11rem);line-height:1.05;white-space:nowrap}
  .qr{grid-area:qr;background:var(--card);padding:clamp(14px,2vh,24px);border-radius:30px;border:1px solid rgba(230,163,182,.4);box-shadow:0 18px 40px -28px rgba(154,90,112,.55)}
  .qr img,.qr canvas{width:clamp(260px,min(70vh,40vw),760px)!important;height:auto!important;display:block}
  .datos{grid-area:datos;align-self:start;display:flex;flex-direction:column;gap:clamp(10px,2vh,22px)}
  .datos .card{padding:clamp(16px,2.6vh,30px) 22px}
  .datos .kicker{font-size:clamp(.85rem,1.7vh,1.15rem)}
  .valor{font-family:var(--serif);font-weight:600;color:var(--rose-ink);font-size:clamp(2.2rem,7vh,4.8rem);line-height:1.1;letter-spacing:.04em;overflow-wrap:anywhere;font-variant-numeric:lining-nums}
  .lead{font-size:clamp(1.3rem,3.4vh,2.3rem);line-height:1.35;color:var(--rose-ink)}
  .volver{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);opacity:.3;transition:opacity .2s}
  .volver:hover,.volver:focus-visible{opacity:1}
  @media (max-width:760px){
    .wifi{grid-template-columns:minmax(0,1fr);grid-template-areas:"cab" "qr" "datos";justify-items:center}
    h1.script{font-size:clamp(3.2rem,16vw,4.6rem)}
    .qr img,.qr canvas{width:min(70vw,320px)!important}
    .datos{width:100%}
    .valor{font-size:clamp(1.6rem,8.5vw,2.6rem);white-space:nowrap}
    .volver{position:static;transform:none;margin-top:20px}
    main{padding-bottom:clamp(90px,17vh,170px)}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="petals" id="petals" aria-hidden="true"></div>
<img class="corner l blend" src="img/ramo.jpg" alt="">
<img class="corner r blend" src="img/ramo.jpg" alt="">
<main>
  <div class="wifi">
    <div class="cab">
      <p class="kicker">Baby Shower de Celeste</p>
      <h1 class="script">Wifi del salón</h1>
    </div>
    <div class="qr"><div id="qr" role="img" aria-label="Código QR para conectarse al wifi"></div></div>
    <div class="datos">
      <p class="lead">Escanea el código con la cámara de tu celular, o escribe estos datos:</p>
      <div class="card"><p class="kicker">Nombre de la red</p><p class="valor" id="red"></p></div>
      <div class="card"><p class="kicker">Contraseña</p><p class="valor" id="clave"></p></div>
    </div>
  </div>
  <a class="btn ghost volver" href="./">Volver a los juegos</a>
</main>
<div class="prado" aria-hidden="true"></div>
<script type="module">
import { petalos } from './petalos.js';
const RED = 'SALON-SOCIAL', CLAVE = '901009930';
const esc = s => s.replace(/([\\;,:"])/g, '\\$1');   // formato estándar de QR de wifi
document.getElementById('red').textContent = RED;
document.getElementById('clave').textContent = CLAVE;
new QRCode(document.getElementById('qr'), { text: `WIFI:T:WPA;S:${esc(RED)};P:${esc(CLAVE)};;`, width: 680, height: 680, colorDark: '#9a5a70', colorLight: '#fefcf8', correctLevel: QRCode.CorrectLevel.M });
petalos(document.getElementById('petals'));
</script>
</body>
</html>
