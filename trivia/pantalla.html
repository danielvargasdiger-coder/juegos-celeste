<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Quién conoce a Celeste?</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../estilo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  html,body{height:100%;overflow:hidden;user-select:none}
  .tv{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(12px,2vh,28px) clamp(20px,3vw,56px);gap:clamp(10px,1.6vh,20px)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-left:clamp(110px,15vh,190px)}
  .top h1{font-size:clamp(40px,7vh,84px)}
  .top .meta{font-weight:600;color:var(--muted);font-size:clamp(16px,2.4vh,26px);letter-spacing:.08em}
  .corner{position:fixed;width:clamp(150px,22vh,260px);opacity:.95;z-index:-1}
  .corner.tl{top:-10px;left:-10px}
  .corner.br{bottom:-10px;right:-10px;transform:rotate(180deg)}
  .escena{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4vh,28px);text-align:center}
  .sala{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center;width:100%;max-width:1600px}
  .qr{background:var(--card);padding:clamp(14px,2vh,24px);border-radius:30px;border:1px solid rgba(230,163,182,.4);box-shadow:0 18px 40px -28px rgba(154,90,112,.55)}
  .qr img,.qr canvas{width:clamp(220px,42vh,460px)!important;height:auto!important}
  .url{font-weight:600;color:var(--rose-ink);font-size:clamp(16px,2.4vh,26px);margin-top:10px;word-break:break-all}
  .escena .kicker{font-size:clamp(14px,2.2vh,24px)}
  .grande{font-family:var(--serif);font-size:clamp(28px,5vh,60px);color:var(--rose-ink);line-height:1.2}
  .lista{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:40vh;overflow:hidden}
  .lista span{background:var(--blush);color:var(--rose-ink);border-radius:999px;padding:6px 16px;font-weight:600;font-size:clamp(16px,2.4vh,26px)}
  .texto{font-family:var(--serif);font-weight:600;font-size:clamp(34px,6.4vh,76px);color:var(--rose-ink);line-height:1.15;max-width:30ch;text-wrap:balance}
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vh,20px);width:100%;max-width:1700px}
  .ops .op{padding:clamp(14px,2.2vh,26px) clamp(18px,2vw,30px);font-size:clamp(22px,3.6vh,42px);min-height:clamp(80px,13vh,150px);transition:opacity .3s}
  .ops .op svg{width:clamp(48px,8vh,90px);height:clamp(48px,8vh,90px)}
  .ops .op .n{margin-left:auto;font-family:var(--serif);font-size:1.1em}
  .ops.revelada .op:not(.ok){opacity:.35}
  .ops.revelada .op.ok{box-shadow:0 0 0 6px var(--paper),0 0 0 10px var(--rose-deep)}
  .reloj{display:flex;align-items:center;gap:24px;font-weight:600;color:var(--rose-ink);font-size:clamp(20px,3vh,34px)}
  .reloj b{font-family:var(--serif);font-size:clamp(44px,8vh,96px);min-width:2ch}
  .doble{background:var(--gold);color:#4a3320;border-radius:999px;padding:4px 16px;font-size:.8em}
  .rank{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,16px);width:min(900px,100%)}
  .rank li{list-style:none;display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid rgba(230,163,182,.4);border-radius:22px;padding:clamp(10px,1.6vh,18px) 28px;font-size:clamp(22px,3.6vh,40px);font-weight:600}
  .rank .p{font-family:var(--serif);color:var(--rose-deep);min-width:2ch}
  .rank .pts{margin-left:auto;font-family:var(--serif);color:var(--rose-ink)}
  .podio{display:flex;align-items:flex-end;gap:clamp(16px,2vw,40px)}
  .podio>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;width:clamp(200px,22vw,360px);border-radius:28px 28px 0 0;background:var(--blush);padding:20px;font-weight:600;font-size:clamp(20px,3.2vh,36px);color:var(--rose-ink)}
  .podio .script{font-size:clamp(48px,9vh,110px)}
  .podio .o1{height:40vh;background:linear-gradient(var(--blush),var(--blush-2))}
  .podio .o2{height:31vh}
  .podio .o3{height:24vh}
  .host{display:flex;gap:12px;align-items:center;flex-wrap:wrap;opacity:.3;transition:opacity .2s}
  .host:hover,.host:has(:focus-visible),.host:has(.aviso:not(:empty)){opacity:1}
  .host .btn{min-height:40px;padding:8px 20px}
  .aviso{font-weight:600;color:var(--rose-ink)}
  .sep{flex:1}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="petals" id="petals" aria-hidden="true"></div>
<img class="corner tl blend" src="../img/ramo.jpg" alt="">
<img class="corner br blend" src="../img/ramo.jpg" alt="">
<div class="tv">
  <header class="top"><h1 class="script">¿Quién conoce a Celeste?</h1><div class="meta" id="meta"></div></header>
  <main class="escena" id="escena" aria-live="polite"><p class="grande">Entra con Google para preparar el juego</p></main>
  <footer class="host">
    <button class="btn ghost" id="entrar" type="button">Entrar con Google</button>
    <button class="btn" id="siguiente" type="button" hidden>Empezar</button>
    <span class="aviso" id="aviso" role="status"></span>
    <span class="sep"></span>
    <button class="btn ghost" id="reiniciar" type="button" hidden>Reiniciar juego</button>
    <button class="btn ghost" id="completa" type="button">Pantalla completa</button>
  </footer>
</div>
<script src="../iconos.js"></script>
<script type="module">
import { auth, db, ahora } from './conexion.js';
import { ANFITRION } from './config.js';
import { PREGUNTAS } from './preguntas-7f3a9c2e.js';
import { cerrarPregunta, nombresVisibles, ordenar, DURACION } from './logica.js';
import { petalos } from '../petalos.js';
import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { ref, onValue, set, update, get, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const $ = id => document.getElementById(id);
const ICONOS = ['corazon', 'estrella', 'luna', 'nube'];
const icono = i => `<svg aria-hidden="true"><use href="#i-${ICONOS[i]}"></use></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CORAZON = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8.2 3.2 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.6 0 5.8 3.7 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';
const URL_JUEGO = new URL('./', location.href).href;
const aviso = t => { $('aviso').textContent = t; };

let juego = null, jugadores = {}, respuestas = {}, resultado = null, clave = null, cerrando = false, ultimoHtml = '', ultimoCambio = 0, escuchando = false;
let offRespuestas = () => {}, offResultado = () => {};

petalos($('petals'));

$('completa').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$('entrar').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => aviso('No se pudo entrar: ' + e.code));
$('siguiente').onclick = () => siguiente();
$('reiniciar').onclick = () => {
  if (!confirm('¿Borrar jugadores, respuestas y puntajes y volver a la sala?')) return;
  update(ref(db), { jugadores: null, respuestas: null, resultados: null, juego: { estado: 'sala' } }).catch(e => aviso('Error al reiniciar: ' + e.code));
};
// Los botones sueltan el foco al tocarlos: así la barra espaciadora siempre avanza el juego y no repite el último botón.
document.querySelector('.host').addEventListener('click', e => e.target.closest('button')?.blur());
document.addEventListener('keydown', e => {
  if (e.key !== ' ' || $('siguiente').hidden) return;
  e.preventDefault();
  if (!e.repeat) siguiente();
});

onAuthStateChanged(auth, u => {
  // Una sesión anónima es de jugador (p. ej. se abrió la página del celular en este navegador): el anfitrión debe entrar con Google.
  if (!u || u.isAnonymous) { $('entrar').hidden = false; return; }
  $('entrar').hidden = true;
  if (u.uid !== ANFITRION) return aviso(`Tu uid es ${u.uid} — ponlo en config.js y en reglas.json`);
  if (escuchando) return;
  escuchando = true; aviso('');
  $('siguiente').hidden = $('reiniciar').hidden = false;
  onValue(ref(db, 'juego'), s => {
    const nuevo = s.val() || { estado: 'sala' };
    if (!juego || juego.estado !== nuevo.estado || juego.clave !== nuevo.clave) ultimoCambio = Date.now();
    juego = nuevo; seguirPregunta(); pintar();
  });
  onValue(ref(db, 'jugadores'), s => { jugadores = s.val() || {}; pintar(); });
});

function seguirPregunta() {
  const c = ['pregunta', 'respuesta', 'ranking'].includes(juego.estado) ? juego.clave : null;
  if (c === clave) return;
  offRespuestas(); offResultado();
  clave = c; respuestas = {}; resultado = null; cerrando = false;
  if (c == null) return;
  offRespuestas = onValue(ref(db, `respuestas/${c}`), s => { respuestas = s.val() || {}; pintar(); });
  offResultado = onValue(ref(db, `resultados/${c}`), s => { resultado = s.val(); pintar(); });
}

function abrir(i) {
  const q = PREGUNTAS[i];
  return set(ref(db, 'juego'), {
    estado: 'pregunta', pregunta: i, clave: String(i), total: PREGUNTAS.length,
    inicio: serverTimestamp(), duracion: DURACION, doble: !!q.doble,
    texto: q.texto, opciones: q.opciones, jugadores: Object.keys(jugadores).length,
  });
}

// Cierra la pregunta y calcula puntajes. También recupera el caso «se recargó la pantalla entre cerrar y calcular».
async function cerrar() {
  if (cerrando || !juego) return;
  const { estado, clave: c, pregunta: i, inicio, duracion } = juego;
  if (estado !== 'pregunta' && !(estado === 'respuesta' && !resultado)) return;
  cerrando = true;
  if (estado === 'pregunta') await update(ref(db, 'juego'), { estado: 'respuesta' });   // desde aquí las reglas rechazan respuestas nuevas
  if ((await get(ref(db, `resultados/${c}`))).exists()) return;                          // ya calculado: nunca sumar dos veces
  const [r, j] = await Promise.all([get(ref(db, `respuestas/${c}`)), get(ref(db, 'jugadores'))]);
  const todos = j.val() || {};
  const { actualizacion } = cerrarPregunta({ p: c, pregunta: PREGUNTAS[i], inicio, duracion, jugadores: todos, respuestas: r.val() || {} });
  actualizacion['juego/jugadores'] = Object.keys(todos).length;
  await update(ref(db), actualizacion);
}

// Un doble clic o la barra sostenida no deben abrir y cerrar una pregunta de golpe: tras cada cambio de pantalla se ignoran 1,5 s.
function siguiente() {
  if (!juego || Date.now() - ultimoCambio < 1500) return;
  const e = juego.estado;
  const fallo = err => aviso('Error: ' + (err.code || err.message));
  if (e === 'sala') return abrir(0).catch(fallo);
  if (e === 'pregunta') return cerrar().catch(err => { cerrando = false; fallo(err); });
  if (e === 'respuesta') return (resultado ? update(ref(db, 'juego'), { estado: 'ranking' }) : cerrar()).catch(err => { cerrando = false; fallo(err); });
  if (e === 'ranking') return (juego.pregunta + 1 < PREGUNTAS.length ? abrir(juego.pregunta + 1) : update(ref(db, 'juego'), { estado: 'final' })).catch(fallo);
}

let sinResultadoDesde = 0;
setInterval(() => {
  if (!juego) return;
  // Pregunta cerrada sin puntajes (la pantalla se recargó mientras calculaba): se recupera sola a los 4 s.
  if (juego.estado === 'respuesta' && !resultado) {
    sinResultadoDesde ||= Date.now();
    if (Date.now() - sinResultadoDesde > 4000) cerrar().catch(err => { cerrando = false; aviso('Error al calcular: ' + (err.code || err.message)); });
    return;
  }
  sinResultadoDesde = 0;
  if (juego.estado !== 'pregunta') return;
  const resta = juego.inicio + juego.duracion - ahora();
  const n = Object.keys(jugadores).length;
  const seg = $('seg');
  if (seg) seg.textContent = Math.max(0, Math.ceil(resta / 1000));
  if (resta <= 0 || (n > 0 && Object.keys(respuestas).length >= n)) cerrar().catch(err => { cerrando = false; aviso('Error al cerrar: ' + (err.code || err.message)); });
}, 200);

const htmlSala = nombres => `
  <div class="sala">
    <div class="qr"><div id="qr"></div><div class="url">${esc(URL_JUEGO.replace(/^https?:\/\//, ''))}</div></div>
    <div>
      <p class="kicker">Escanea el código con tu celular</p>
      <p class="grande">Escribe tu nombre y espera la primera pregunta</p>
      <div class="orn"><i></i>${CORAZON}<i></i></div>
      <div class="lista">${Object.values(nombres).map(x => `<span>${esc(x)}</span>`).join('') || '<span>Aún no entra nadie</span>'}</div>
    </div>
  </div>`;

function htmlPregunta() {
  const rev = juego.estado === 'respuesta' && resultado;
  const n = Object.keys(jugadores).length, nr = Object.keys(respuestas).length;
  const seg = Math.max(0, Math.ceil((juego.inicio + juego.duracion - ahora()) / 1000));
  const ops = juego.opciones.map((o, i) =>
    `<div class="op op${i}${rev && i === resultado.correcta ? ' ok' : ''}">${icono(i)}<span>${esc(o)}</span>${rev ? `<span class="n">${resultado.conteo[i]}</span>` : ''}</div>`).join('');
  const pie = juego.estado === 'pregunta' ? `<b id="seg">${seg}</b><span>${nr} de ${n} respondieron</span>`
    : rev ? `<span>${resultado.conteo.reduce((a, b) => a + b, 0)} de ${n} respondieron</span>` : '<span>Calculando…</span>';
  return `<p class="texto">${esc(juego.texto)}</p><div class="ops${rev ? ' revelada' : ''}">${ops}</div>
    <div class="reloj">${pie}${juego.doble ? '<span class="doble">Vale doble</span>' : ''}</div>`;
}

const fila = (uid, puesto, nombres) => `<li><span class="p">${puesto}</span><span>${esc(nombres[uid])}</span><span class="pts">${jugadores[uid].puntos || 0}</span></li>`;
const htmlRanking = nombres => `<p class="kicker">Así van</p><ol class="rank">${ordenar(jugadores).slice(0, 5).map((uid, i) => fila(uid, i + 1, nombres)).join('')}</ol>`;
function htmlFinal(nombres) {
  const o = ordenar(jugadores);
  const podio = [1, 0, 2].filter(i => o[i]).map(i =>
    `<div class="o${i + 1}"><span class="script">${i + 1}</span><span>${esc(nombres[o[i]])}</span><span>${jugadores[o[i]].puntos || 0}</span></div>`).join('');
  const resto = o.slice(3, 10).map((uid, i) => `<span>${i + 4}. ${esc(nombres[uid])}</span>`).join('');
  return `<p class="kicker">¡Ganadores!</p><div class="podio">${podio}</div><div class="lista">${resto}</div>`;
}

function pintar() {
  if (!juego) return;
  const e = juego.estado, n = Object.keys(jugadores).length, nombres = nombresVisibles(jugadores);
  const btn = $('siguiente');
  btn.textContent = { sala: 'Empezar', pregunta: 'Cerrar pregunta', respuesta: resultado ? 'Ver ranking' : 'Calcular puntajes',
    ranking: juego.pregunta + 1 < PREGUNTAS.length ? 'Siguiente pregunta' : 'Ver podio', final: 'Fin' }[e];
  btn.disabled = e === 'final' || (e === 'sala' && n === 0);
  $('meta').textContent = e === 'sala' || e === 'final' ? `${n} ${n === 1 ? 'jugador' : 'jugadores'}` : `Pregunta ${juego.pregunta + 1} de ${juego.total}`;
  const html = { sala: htmlSala, pregunta: htmlPregunta, respuesta: htmlPregunta, ranking: htmlRanking, final: htmlFinal }[e](nombres);
  if (html === ultimoHtml) return;
  ultimoHtml = html;
  $('escena').innerHTML = html;
  if (e === 'sala') new QRCode($('qr'), { text: URL_JUEGO, width: 460, height: 460, colorDark: '#9a5a70', colorLight: '#fefcf8', correctLevel: QRCode.CorrectLevel.M });
  if (e === 'final') petalos($('petals'), 40);
}
</script>
</body>
</html>
