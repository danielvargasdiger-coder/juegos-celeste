<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo de Celeste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&display=swap">
<style>
/* Layout para televisor 16:9. Arriba: título y figura de la ronda. Izquierda: la ficha que salió. Derecha: tablero B-I-N-G-O con íconos que crecen para llenar el espacio. Abajo: controles del anfitrión, tenues hasta pasar el mouse. Un solo look (papelería de la invitación), sin modo oscuro. */
:root{
  --paper:#fdfaf3; --card:#fffdf9; --blush:#f8e3e8; --rose-soft:#f3c9d3;
  --rose:#b4546f; --rose-mid:#d98fa5; --rose-alt:#e292aa; --gold:#c29f81; --gold-soft:#efe1cc;
  --ink:#6b3c4f; --muted:#8a5a6c; --ok:#4f7a54; --ok-soft:#e3eee1; --no:#a5483f; --no-soft:#f6e2df;
  --display:'Great Vibes','Brush Script MT',cursive;
  --serif:'Cormorant Garamond','Garamond','Georgia',serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button,input{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(8px,1.4vh,18px) clamp(14px,2vw,32px);padding-block:clamp(8px,1.4vh,18px)}

/* Encabezado: marca a la izquierda, figura de la ronda a la derecha */
.head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:clamp(12px,2vw,32px)}
.brand{display:flex;align-items:center;gap:clamp(8px,1vw,16px);min-width:0}
.coche{flex:none;width:clamp(110px,15vh,170px);aspect-ratio:1.45;max-width:100%;overflow:hidden;position:relative;
  -webkit-mask-image:radial-gradient(ellipse 52% 56% at 50% 54%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 52% 56% at 50% 54%,#000 58%,transparent 100%)}
.coche img{position:absolute;left:0;top:-22%;width:100%;max-width:none;mix-blend-mode:multiply}
.kicker{font-size:clamp(11px,1.35vh,15px);letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--rose)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,7vh,80px);line-height:1;color:var(--rose);text-wrap:balance}
.brand .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.round{display:flex;align-items:center;gap:clamp(12px,1.4vw,22px);background:var(--card);border:1.5px solid var(--gold-soft);border-radius:20px;padding:clamp(8px,1.2vh,14px) clamp(16px,1.8vw,28px) clamp(8px,1.2vh,14px) clamp(10px,1.2vw,18px);min-width:0}
.round .mini{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:clamp(56px,9vh,96px)}
.round .mini i{aspect-ratio:1;border-radius:3px;background:var(--gold-soft)}
.round .mini i.on{background:var(--rose)}
.round .mini i.free{background:var(--rose-mid)}
.round .nm{font-size:clamp(30px,5.4vh,58px);font-weight:700;line-height:1;color:var(--ink)}
.round .hint{font-size:clamp(14px,2vh,22px);color:var(--muted);font-weight:600;margin-top:2px}

/* Escenario: la ficha que acaba de salir */
.left{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px)}
.stage{position:relative;flex:1;min-height:0;background:var(--card);border:1.5px solid var(--gold-soft);border-radius:22px;
  box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 7.5px var(--rose-soft);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(16px,3vh,36px)}
.stage .flor{position:absolute;width:clamp(120px,22vh,230px);pointer-events:none;mix-blend-mode:multiply;opacity:.95;-webkit-mask-image:radial-gradient(circle at 0 0,#000 52%,transparent 74%);mask-image:radial-gradient(circle at 0 0,#000 52%,transparent 74%)}
.stage .flor.a{left:0;top:0}
.stage .flor.b{right:0;bottom:0;transform:scale(-1,-1)}
.big{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1vh,12px);text-align:center}
.big .fig{position:relative}
.big svg{width:clamp(130px,31vh,360px);height:clamp(130px,31vh,360px);filter:drop-shadow(0 6px 10px rgba(180,84,111,.12))}
.big .letter{position:absolute;left:-14%;top:-6%;width:clamp(70px,14vh,150px);height:clamp(70px,14vh,150px);border-radius:50%;
  background:var(--rose);color:#fff;font-weight:700;font-size:clamp(44px,9.5vh,100px);line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px var(--card),0 0 0 8px var(--rose-soft)}
.big .name{font-size:clamp(40px,9.5vh,110px);font-weight:700;line-height:1;color:var(--ink)}
.big .name b{color:var(--rose)}
.big .label{font-size:clamp(13px,1.8vh,20px);letter-spacing:.28em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.big .rule{font-size:clamp(16px,2.6vh,28px);font-weight:600;color:var(--muted);min-height:1.2em}
.big .rule b{color:var(--rose)}
.big.empty .name{font-family:var(--display);font-weight:400;color:var(--rose)}
.big.empty .letter{display:none}
.big.land{animation:land .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes land{from{transform:scale(.6);opacity:.2}to{transform:scale(1);opacity:1}}
.big.spin svg{opacity:.55}

.lb{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;background:var(--rose);color:#fff;font-weight:700;font-family:var(--serif)}
.prev{display:flex;align-items:center;gap:10px;min-height:clamp(40px,5.5vh,60px);flex-wrap:nowrap;overflow:hidden}
.prev .t{font-size:clamp(12px,1.6vh,17px);letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 14px 4px 4px;border-radius:999px;background:var(--blush);font-weight:700;font-size:clamp(14px,2.2vh,24px)}
.chip .lb{width:clamp(26px,3.6vh,38px);height:clamp(26px,3.6vh,38px);font-size:clamp(16px,2.2vh,24px)}
.chip svg{width:clamp(28px,4vh,42px);height:clamp(28px,4vh,42px)}

/* Tablero: los íconos crecen para llenar el espacio (fitBoard) */
.panel{background:var(--card);border:1.5px solid var(--gold-soft);border-radius:18px;padding:clamp(10px,1.6vh,18px) clamp(12px,1.4vw,20px);display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);min-width:0}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h2{margin:0;font-size:clamp(14px,2vh,22px);letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--rose)}
.ptitle .n{font-size:clamp(16px,2.4vh,26px);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.boardwrap{min-height:0;overflow:hidden}
.board{flex:1;min-height:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(4px,.8vh,8px)}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(10px,1vw,16px);align-items:stretch;min-height:0;padding-bottom:clamp(4px,.8vh,8px);border-bottom:1px dashed var(--rose-soft)}
.brow:last-child{border-bottom:0;padding-bottom:0}
.brow .lb{align-self:center;width:clamp(44px,7.5vh,80px);height:clamp(44px,7.5vh,80px);border-radius:14px;font-size:clamp(28px,5vh,54px)}
.brow:nth-child(even) .lb{background:var(--rose-alt)}
.brow .figs{display:flex;flex-wrap:wrap;gap:4px;align-content:center;align-items:center;min-height:0;overflow:hidden}
.brow .figs svg{flex:none;width:var(--s,56px);height:var(--s,56px);border-radius:12px;padding:2px}
.brow .figs svg.last{background:var(--rose-soft);box-shadow:0 0 0 3px var(--rose)}
.brow .figs .none{font-size:clamp(14px,2vh,20px);color:var(--muted)}

/* Barra del anfitrión: tenue en el televisor, se aclara al pasar el mouse */
.hostbar{grid-column:1/-1;display:flex;gap:10px 14px;align-items:center;flex-wrap:nowrap;white-space:nowrap;min-width:0;opacity:.3;transition:opacity .2s}
.hostbar:hover,.hostbar:has(:focus-visible),.hostbar:has(.confirm),.hostbar:has(.err:not([hidden])){opacity:1}
.btn{border:0;border-radius:14px;min-height:44px;padding:8px 20px;font-size:clamp(16px,2vh,21px);font-weight:700;letter-spacing:.02em}
.btn.primary{background:var(--rose);color:#fff;box-shadow:0 4px 0 #8f3f56}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #8f3f56}
.btn.primary:disabled{background:var(--rose-mid);box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--rose);border:1.5px solid var(--rose-soft)}
.btn.ghost:disabled{opacity:.45;cursor:default}
.kbd{font-size:.7em;opacity:.8;font-weight:600;margin-left:6px}
@media (max-width:1600px){.kbd{display:none}.hostbar{gap:8px}.hostbar .btn{padding-inline:14px}}
.sep{flex:1}
.hostbar label{font-size:clamp(15px,1.9vh,19px);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.hostbar select,.hostbar input{min-height:44px;border-radius:12px;border:1.5px solid var(--rose-soft);background:var(--paper);color:var(--ink);font:inherit;font-size:clamp(16px,2vh,20px);font-weight:700;padding:0 10px}
.hostbar input{width:10ch;text-align:center;font-variant-numeric:tabular-nums}
.verify{display:flex;gap:8px;align-items:center}
.err{color:var(--no);font-weight:600;font-size:15px}
.link{background:none;border:0;color:var(--muted);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.confirm .btn{min-height:40px;padding:6px 14px;font-size:16px}
.host{font-size:15px;color:var(--muted);font-weight:600}
.host b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Verificación */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(253,250,243,.95);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.vbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3vw,48px);align-items:center;max-width:1320px;width:100%}
.vcard{background:var(--card);border:2px solid var(--rose-mid);border-radius:20px;box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 7.5px var(--rose-soft);padding:clamp(12px,2vh,22px);display:flex;flex-direction:column;align-items:center;gap:8px}
.vcard .ttl{font-family:var(--display);font-size:clamp(28px,4.5vh,46px);color:var(--rose);line-height:1}
.vgrid{display:grid;grid-template-columns:repeat(5,clamp(52px,14vh,150px));gap:6px}
.vgrid .h{height:clamp(30px,5vh,48px);border-radius:10px 10px 0 0;background:var(--rose-mid);color:#fff;font-weight:700;font-size:clamp(20px,3.4vh,32px);display:flex;align-items:center;justify-content:center}
.vgrid .h:nth-child(even){background:var(--rose-alt)}
.vc{position:relative;aspect-ratio:1;border-radius:10px;background:#fff;border:1.5px solid var(--rose-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.vc>*{position:relative;z-index:1}
.vc svg{width:62%;height:62%}
.vc span{font-size:clamp(9px,1.7vh,18px);font-weight:700;line-height:1}
.vc.free{background:var(--blush)}
.vc.free span{font-family:var(--display);font-weight:400;font-size:clamp(14px,2.2vh,22px);color:var(--rose)}
.vc.mk{background:var(--blush)}
.vc.mk::before{content:"";position:absolute;z-index:0;left:50%;top:44%;width:68%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(217,143,165,.38);border:2px solid rgba(180,84,111,.5)}
.vc.pt{box-shadow:0 0 0 3px var(--gold)}
.vc.miss{box-shadow:0 0 0 3px var(--no);background:var(--no-soft)}
.vc.win{box-shadow:0 0 0 3px var(--ok)}
.verdict{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,18px);min-width:0}
.badge{align-self:flex-start;border-radius:999px;padding:6px 16px;font-weight:700;font-size:clamp(14px,1.9vh,18px);letter-spacing:.14em;text-transform:uppercase}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--no-soft);color:var(--no)}
.badge.tie{background:var(--gold-soft);color:var(--ink)}
.verdict h3{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(52px,10.5vh,116px);line-height:.95;color:var(--rose);text-wrap:balance}
.verdict h3.no{color:var(--ink)}
.verdict p{margin:0;font-size:clamp(18px,2.6vh,28px);line-height:1.3;max-width:36ch}
.verdict .missing{display:flex;flex-wrap:wrap;gap:8px}
.verdict .missing .chip{background:var(--no-soft)}
.claims{display:flex;flex-wrap:wrap;gap:8px}
.claim{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--rose-soft);background:var(--card);color:var(--ink);font-weight:700;font-size:clamp(15px,2vh,19px)}
.claim .dot{width:12px;height:12px;border-radius:50%}
.claim.ok .dot{background:var(--ok)}
.claim.no .dot{background:var(--no)}
.claim[aria-pressed="true"]{border-color:var(--rose);background:var(--blush)}
.claim.winner{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.verdict .row{display:flex;gap:12px;flex-wrap:wrap}
.tiewheel{font-size:clamp(48px,9vh,96px);font-weight:700;color:var(--rose);font-variant-numeric:tabular-nums;line-height:1}
.petal{position:fixed;top:-40px;z-index:21;width:26px;height:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}

@media (max-width:900px){
  html,body{height:auto}
  .app{grid-template-columns:minmax(0,1fr)}
  .head{flex-wrap:wrap}
  .stage{min-height:420px}
  .board{grid-template-rows:repeat(5,minmax(70px,auto))}
  .hostbar{opacity:1;flex-wrap:wrap;white-space:normal}
  .vbox{grid-template-columns:minmax(0,1fr);justify-items:center}
  .vgrid{grid-template-columns:repeat(5,minmax(0,1fr));width:100%}
  .vcard{width:100%;max-width:480px}
}
@media (prefers-reduced-motion:reduce){
  .big.land{animation:none}
  .petal{display:none}
}
</style>

<script>
const STORE = 'bingo-celeste-v2';
let state = {drawn: [], pattern: 'linea'};
const $ = id => document.getElementById(id);
const icon = (k, cls) => `<svg${cls ? ` class="${cls}"` : ''} aria-hidden="true"><use href="#i-${k}"></use></svg>`;
const split = b => { const [L, k] = b.split(':'); return {L, k}; };
const ballChip = b => { const {L, k} = split(b); return `<span class="chip"><span class="lb">${L}</span>${icon(k)}${NAMES[k]}</span>`; };

function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (s && Array.isArray(s.drawn) && s.drawn.every(b => POOL.includes(b))) return s;
  } catch (e) {}
  return null;
}
function randInt(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
}

/* ---------- Render ---------- */
function renderPatterns() {
  const p = PATTERNS.find(x => x.id === state.pattern), on = new Set(p.mini || p.cells);
  $('roundMini').innerHTML = ALL.map(i => `<i class="${i === 12 ? 'free' : on.has(i) ? 'on' : ''}"></i>`).join('');
  $('roundName').textContent = p.name;
  $('pathint').textContent = p.hint;
  $('patSel').value = p.id;
}

/* Íconos del tablero: el tamaño más grande con el que la fila más llena cabe en su espacio */
function fitBoard() {
  const rows = [...document.querySelectorAll('.brow .figs')];
  const W = rows[0].clientWidth, H = rows[0].clientHeight, gap = 4;
  const n = Math.max(1, ...rows.map(r => r.querySelectorAll('svg').length));
  let s = Math.min(H, 120);
  while (s > 22 && Math.ceil(n / Math.max(1, Math.floor((W + gap) / (s + gap)))) * (s + gap) - gap > H) s -= 2;
  $('board').style.setProperty('--s', s + 'px');
}

function renderBoard() {
  const last = state.drawn[state.drawn.length - 1];
  $('board').innerHTML = COLS.map(L => {
    const mine = state.drawn.filter(b => b[0] === L);
    const figs = mine.length
      ? mine.map(b => { const k = split(b).k; return `<svg class="${b === last ? 'last' : ''}" role="img" aria-label="${L} ${NAMES[k]}"><title>${L} · ${NAMES[k]}</title><use href="#i-${k}"></use></svg>`; }).join('')
      : `<span class="none">Aún no sale ninguna</span>`;
    return `<div class="brow"><span class="lb">${L}</span><div class="figs">${figs}</div></div>`;
  }).join('');
  $('count').textContent = `${state.drawn.length} de ${TOTAL}`;
  fitBoard();
  const prev = state.drawn.slice(-4, -1).reverse();
  $('prev').innerHTML = prev.length ? `<span class="t">Anteriores</span>` + prev.map(ballChip).join('') : '';
  $('drawBtn').disabled = state.drawn.length >= TOTAL;
  $('drawBtn').firstChild.textContent = state.drawn.length >= TOTAL ? 'Ya salieron todas ' : 'Sacar ficha ';
  $('undoBtn').disabled = state.drawn.length === 0;
  renderHost();
}

function showBig(b, land) {
  const big = $('big');
  if (!b) {
    big.className = 'big empty';
    $('bigUse').setAttribute('href', '#i-corazon');
    $('bigLabel').textContent = 'Listos para empezar';
    $('bigName').textContent = '¡A jugar!';
    $('bigRule').textContent = '';
    return;
  }
  const {L, k} = split(b);
  big.className = 'big';
  $('bigUse').setAttribute('href', '#i-' + k);
  $('bigLetter').textContent = L;
  $('bigLabel').textContent = 'Ficha ' + (state.drawn.indexOf(b) + 1);
  $('bigName').innerHTML = `<b>${L}</b> · ${NAMES[k]}`;
  $('bigRule').innerHTML = `Solo cuenta si la tienes en la columna <b>${L}</b>`;
  if (land) { void big.offsetWidth; big.classList.add('land'); }
}

/* ---------- Sorteo ---------- */
let spinning = false;
function draw() {
  if (spinning || state.drawn.length >= TOTAL) return;
  const used = new Set(state.drawn);
  const left = POOL.filter(b => !used.has(b));
  const pick = left[randInt(left.length)];
  const finish = () => {
    state.drawn.push(pick);
    save();
    spinning = false;
    showBig(pick, true);
    renderBoard();
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || left.length === 1) return finish();
  spinning = true;
  $('big').className = 'big spin';
  $('bigLabel').textContent = 'Revolviendo…';
  $('bigName').textContent = '·  ·  ·';
  $('bigRule').textContent = '';
  let t = 0;
  const tick = () => {
    const r = split(left[randInt(left.length)]);
    $('bigUse').setAttribute('href', '#i-' + r.k);
    $('bigLetter').textContent = r.L;
    t += 1;
    if (t < 11) setTimeout(tick, 45 + t * 6); else finish();
  };
  tick();
}
function undo() {
  if (spinning || !state.drawn.length) return;
  state.drawn.pop();
  save();
  showBig(state.drawn[state.drawn.length - 1], false);
  renderBoard();
}

/* ---------- Verificación ---------- */
let claims = [];   // [{n, res}]
function renderCard(n, res) {
  const card = CARDS[n - 1];
  const drawn = new Set(state.drawn);
  const inPat = new Set(res.cells), miss = new Set(res.missing);
  $('vCardTitle').textContent = 'Cartón N.º ' + String(n).padStart(2, '0');
  $('vgrid').innerHTML = COLS.map(l => `<div class="h">${l}</div>`).join('') + card.map((k, i) => {
    if (k === 'FREE') return `<div class="vc free mk${inPat.has(i) ? (res.win ? ' win' : ' pt') : ''}">${icon('corazon')}<span>Celeste</span></div>`;
    const cls = ['vc'];
    if (drawn.has(cellBall(card, i))) cls.push('mk');
    if (miss.has(i)) cls.push('miss'); else if (inPat.has(i)) cls.push(res.win ? 'win' : 'pt');
    return `<div class="${cls.join(' ')}">${icon(k)}<span>${NAMES[k]}</span></div>`;
  }).join('');
  [...$('vClaims').children].forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === n)));
}

function verify(nums) {
  const drawn = new Set(state.drawn);
  const p = PATTERNS.find(x => x.id === state.pattern);
  claims = nums.map(n => ({n, res: check(n - 1, drawn, state.pattern)}));
  const ok = claims.filter(c => c.res.win);
  const badge = $('vBadge'), title = $('vTitle'), text = $('vText');
  $('vMissing').innerHTML = '';
  $('tieWheel').hidden = true; $('tieWheel').textContent = '';
  $('tieBtn').hidden = true; $('tieBtn').disabled = false;
  $('vClaims').innerHTML = claims.length > 1 ? claims.map(c =>
    `<button type="button" class="claim ${c.res.win ? 'ok' : 'no'}" data-n="${c.n}" aria-pressed="false"><span class="dot"></span>Cartón ${c.n} · ${c.res.win ? 'válido' : 'no'}</button>`).join('') : '';
  const show = (ok[0] || claims[0]);
  renderCard(show.n, show.res);

  if (ok.length > 1) {
    badge.className = 'badge tie'; badge.textContent = 'Empate · ' + p.name;
    title.className = ''; title.textContent = '¡Empate!';
    text.textContent = `Los cartones ${ok.map(c => c.n).join(', ')} tienen bingo válido. Sortea quién se lleva el premio.`;
    $('tieBtn').hidden = false;
  } else if (ok.length === 1) {
    const c = ok[0];
    badge.className = 'badge ok'; badge.textContent = 'Bingo válido · ' + p.name;
    title.className = ''; title.textContent = '¡Bingo!';
    text.textContent = p.lines
      ? `El cartón ${c.n} completó ${c.res.where} con fichas que ya salieron.`
      : `El cartón ${c.n} completó la figura «${p.name}» con fichas que ya salieron.`;
    if (claims.length > 1) text.textContent += ' Los demás cartones todavía no tienen bingo.';
    celebrate();
  } else {
    const c = claims[0], card = CARDS[c.n - 1];
    badge.className = 'badge no'; badge.textContent = 'Todavía no · ' + p.name;
    title.className = 'no'; title.textContent = 'Aún no es bingo';
    if (claims.length > 1) {
      text.textContent = 'Ninguno de estos cartones tiene bingo todavía. Toca un cartón para ver qué le falta.';
    } else {
      const balls = c.res.missing.map(i => cellBall(card, i));
      text.textContent = p.lines
        ? `Lo más cerca está ${c.res.where}. Le ${balls.length === 1 ? 'falta esta ficha' : 'faltan estas fichas'}:`
        : `Para «${p.name}» le ${balls.length === 1 ? 'falta esta ficha' : `faltan ${balls.length} fichas`}:`;
      $('vMissing').innerHTML = balls.map(ballChip).join('');
    }
  }
  $('overlay').hidden = false;
  $('vClose').focus();
}

function tieBreak() {
  const ok = claims.filter(c => c.res.win);
  if (ok.length < 2) return;
  $('tieBtn').disabled = true;
  const wheel = $('tieWheel'); wheel.hidden = false;
  const winner = ok[randInt(ok.length)];
  const end = () => {
    wheel.textContent = 'Gana el cartón ' + winner.n;
    $('vTitle').textContent = '¡Bingo!';
    $('vText').textContent = `Desempate entre los cartones ${ok.map(c => c.n).join(', ')}. El sorteo eligió el cartón ${winner.n}.`;
    $('tieBtn').hidden = true;
    $('vBadge').className = 'badge ok'; $('vBadge').textContent = 'Desempate sorteado';
    [...$('vClaims').children].forEach(b => b.classList.toggle('winner', +b.dataset.n === winner.n));
    renderCard(winner.n, winner.res);
    celebrate();
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return end();
  let t = 0;
  const tick = () => {
    wheel.textContent = 'Cartón ' + ok[t % ok.length].n;
    t += 1;
    if (t < 18 + randInt(ok.length)) setTimeout(tick, 70 + t * 9); else end();
  };
  tick();
}

function celebrate() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#f3c9d3', '#e292aa', '#efe1cc', '#d98fa5'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 100 100'); s.setAttribute('class', 'petal'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = `<path d="M50 86 C8 56 12 18 35 18 C43 18 50 24 50 32 C50 24 57 18 65 18 C88 18 92 56 50 86 Z" fill="${colors[i % 4]}"/>`;
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
}

function renderHost() {
  const out = $('hostOut');
  if (out.hidden) return;
  const w = winners(state.drawn, state.pattern);
  const name = PATTERNS.find(p => p.id === state.pattern).name;
  out.innerHTML = w.length
    ? `Con la figura «${name}», ya tienen bingo: <b>${w.join(', ')}</b>`
    : `Con la figura «${name}», ningún cartón tiene bingo todavía.`;
}

function parseNums(s) {
  const parts = (s.match(/\d+/g) || []).map(Number);
  const bad = parts.filter(n => !(n >= 1 && n <= CARDS.length));
  return {nums: [...new Set(parts)].filter(n => n >= 1 && n <= CARDS.length), bad};
}

/* ---------- Eventos ---------- */
function bind() {
  $('drawBtn').addEventListener('click', draw);
  $('undoBtn').addEventListener('click', undo);
  $('fsBtn').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); }
    } catch (e) {}
  });
  document.addEventListener('fullscreenchange', () => { $('fsBtn').textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa'; });
  $('patSel').addEventListener('change', e => { state.pattern = e.target.value; save(); renderPatterns(); renderHost(); e.target.blur(); });
  addEventListener('resize', fitBoard);
  $('vform').addEventListener('submit', e => {
    e.preventDefault();
    const {nums, bad} = parseNums($('cardNum').value);
    const err = $('verr');
    if (!nums.length || bad.length) {
      err.textContent = bad.length ? `No existe el cartón ${bad.join(', ')}. Los cartones van del 1 al 55.` : 'Escribe el número del cartón (del 1 al 55).';
      err.hidden = false; return;
    }
    err.hidden = true;
    verify(nums);
  });
  $('vClaims').addEventListener('click', e => {
    const b = e.target.closest('.claim'); if (!b) return;
    const c = claims.find(x => x.n === +b.dataset.n);
    renderCard(c.n, c.res);
    if (claims.every(x => !x.res.win)) {
      const card = CARDS[c.n - 1];
      $('vMissing').innerHTML = c.res.missing.map(i => ballChip(cellBall(card, i))).join('');
    }
  });
  $('tieBtn').addEventListener('click', tieBreak);
  $('vClose').addEventListener('click', closeOverlay);
  $('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeOverlay(); });
  $('resetBtn').addEventListener('click', askReset);
  $('hostBtn').addEventListener('click', () => {
    const out = $('hostOut'); out.hidden = !out.hidden;
    $('hostBtn').setAttribute('aria-expanded', String(!out.hidden));
    $('hostBtn').textContent = out.hidden ? 'Ver cartones con bingo' : 'Ocultar cartones con bingo';
    renderHost();
  });
  document.addEventListener('keydown', e => {
    if (!$('overlay').hidden) { if (e.key === 'Escape') closeOverlay(); return; }
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'button' || tag === 'select') return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); draw(); }
  });
}
function closeOverlay() { $('overlay').hidden = true; $('cardNum').value = ''; document.activeElement?.blur(); }
function askReset() {
  $('resetArea').innerHTML = `<div class="confirm">¿Borrar las ${state.drawn.length} fichas cantadas?
    <button class="btn primary" id="resetYes" type="button">Sí, nueva ronda</button>
    <button class="btn ghost" id="resetNo" type="button">Cancelar</button></div>`;
  const back = () => { $('resetArea').innerHTML = `<button class="link" id="resetBtn" type="button">Nueva ronda</button>`; $('resetBtn').addEventListener('click', askReset); };
  $('resetYes').addEventListener('click', () => { state.drawn = []; save(); showBig(null); renderBoard(); back(); });
  $('resetNo').addEventListener('click', back);
}

function start(data) {
  const s = (data && Array.isArray(data.drawn) && data.drawn.every(b => POOL.includes(b))) ? data : load();
  if (s) state = {drawn: s.drawn.slice(), pattern: PATTERNS.some(p => p.id === s.pattern) ? s.pattern : 'linea'};
  $('patSel').innerHTML = PATTERNS.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  renderPatterns();
  renderBoard();
  showBig(state.drawn[state.drawn.length - 1], false);
  bind();
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
